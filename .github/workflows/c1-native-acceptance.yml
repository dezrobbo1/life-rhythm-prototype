name: C1 native acceptance (blocked draft)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: c1-native-preview-prj_Os5Ucic7cDQwut3mO3I39V3lc52s
  cancel-in-progress: false
jobs:
  preflight:
    if: >-
      github.repository == 'dezrobbo1/life-rhythm-prototype' &&
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
      vars.C1_NATIVE_ENABLED == 'true' && vars.C1_TRUSTED_HARNESS_SHA != '' &&
      github.workflow_sha == vars.C1_TRUSTED_HARNESS_SHA
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      checks: read
      statuses: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ vars.C1_TRUSTED_HARNESS_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.19.0"
      - run: node tools/c1-native-acceptance/preflight.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          C1_ENABLED: ${{ vars.C1_NATIVE_ENABLED }}
          C1_TRUSTED_SHA: ${{ vars.C1_TRUSTED_HARNESS_SHA }}
          C1_HARNESS_SHA: ${{ vars.C1_TRUSTED_HARNESS_SHA }}
  native:
    needs: preflight
    environment: c1-native-preview
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      pull-requests: read
      checks: read
      statuses: read
    defaults:
      run:
        working-directory: tools/c1-native-acceptance
    steps:
      - name: Start absolute job budget before preparation
        working-directory: /tmp
        run: |
          started=$(date +%s%3N)
          echo "C1_JOB_STARTED_AT=$started" >> "$GITHUB_ENV"
          echo "C1_JOB_DEADLINE_MS=$((started + 19 * 60 * 1000))" >> "$GITHUB_ENV"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ vars.C1_TRUSTED_HARNESS_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.19.0"
      # Dependency/browser preparation never receives account secrets.
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm test
      # Verify the reviewed attribution interface before entering the secret step.
      # Disabled/missing signer configuration fails; variables cannot bypass it.
      - name: Require authenticated deployment attribution (currently BLOCK)
        run: node run.mjs --admission
        env:
          C1_ENABLED: ${{ vars.C1_NATIVE_ENABLED }}
          C1_TRUSTED_SHA: ${{ vars.C1_TRUSTED_HARNESS_SHA }}
          C1_HARNESS_SHA: ${{ vars.C1_TRUSTED_HARNESS_SHA }}
      - name: Run bounded native acceptance
        run: |
          ulimit -c 0
          node run.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          C1_ENABLED: ${{ vars.C1_NATIVE_ENABLED }}
          C1_TRUSTED_SHA: ${{ vars.C1_TRUSTED_HARNESS_SHA }}
          C1_HARNESS_SHA: ${{ vars.C1_TRUSTED_HARNESS_SHA }}
          C1_ACCOUNT_A_PASSWORD: ${{ secrets.C1_ACCOUNT_A_PASSWORD }}
          C1_ACCOUNT_B_PASSWORD: ${{ secrets.C1_ACCOUNT_B_PASSWORD }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: c1-sanitized-results
          path: tools/c1-native-acceptance/artifacts/results.json
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 9
