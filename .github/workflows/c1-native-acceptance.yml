name: C1 final native acceptance
on:
  workflow_dispatch:
    inputs:
      protection_mode:
        description: Reviewed deployment-admission mode (never automatic fallback)
        required: true
        type: choice
        default: trusted-source
        options:
          - trusted-source
          - automation-bypass
env:
  C1_PROTECTION_MODE: ${{ inputs.protection_mode }}
permissions:
  contents: read
concurrency:
  group: c1-native-preview-prj_Os5Ucic7cDQwut3mO3I39V3lc52s
  cancel-in-progress: false
jobs:
  preflight:
    name: C1 external pre admission
    outputs:
      pre_receipt_id: ${{ steps.observation.outputs.pre_receipt_id }}
      pre_receipt_digest: ${{ steps.observation.outputs.pre_receipt_digest }}
      pre_job_id: ${{ steps.observation.outputs.pre_job_id }}
    if: >-
      github.repository == 'dezrobbo1/life-rhythm-prototype' &&
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
      vars.C1_NATIVE_ENABLED == 'true' && vars.C1_TRUSTED_HARNESS_SHA != '' &&
      github.workflow_sha == vars.C1_TRUSTED_HARNESS_SHA
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: read
      pull-requests: read
      checks: read
      statuses: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ vars.C1_TRUSTED_HARNESS_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.19.0"
      - run: node tools/c1-native-acceptance/preflight.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          C1_ENABLED: ${{ vars.C1_NATIVE_ENABLED }}
          C1_TRUSTED_SHA: ${{ vars.C1_TRUSTED_HARNESS_SHA }}
          C1_HARNESS_SHA: ${{ vars.C1_TRUSTED_HARNESS_SHA }}
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: tools/c1-native-acceptance
      - name: Await fresh external connector observation
        id: observation
        run: node run.mjs --pre
        working-directory: tools/c1-native-acceptance
        env:
          GITHUB_TOKEN: ${{ github.token }}
          C1_ENABLED: ${{ vars.C1_NATIVE_ENABLED }}
          C1_TRUSTED_SHA: ${{ vars.C1_TRUSTED_HARNESS_SHA }}
          C1_HARNESS_SHA: ${{ vars.C1_TRUSTED_HARNESS_SHA }}
  native:
    name: C1 native test phase
    outputs:
      phase_result_b64: ${{ steps.phase.outputs.phase_result_b64 }}
      phase_digest: ${{ steps.phase.outputs.phase_digest }}
      native_job_id: ${{ steps.phase.outputs.native_job_id }}
    needs: preflight
    environment: c1-native-preview
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      issues: read
      id-token: write
      pull-requests: read
      checks: read
      statuses: read
    defaults:
      run:
        working-directory: tools/c1-native-acceptance
    steps:
      - name: Start absolute job budget before preparation
        working-directory: /tmp
        run: |
          started=$(date +%s%3N)
          echo "C1_JOB_STARTED_AT=$started" >> "$GITHUB_ENV"
          echo "C1_JOB_DEADLINE_MS=$((started + 19 * 60 * 1000))" >> "$GITHUB_ENV"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ vars.C1_TRUSTED_HARNESS_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.19.0"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 07469f9f13aa3887a6ec7847b7b642a839651e63
          path: c1-app-under-test
          persist-credentials: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: c1-app-under-test/app
      - run: node prepare-source-fixture.mjs
      # Dependency/browser preparation never receives account secrets.
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm test
      # Verify the reviewed attribution interface before entering the secret step.
      # Disabled/missing signer configuration fails; variables cannot bypass it.
      - name: Require authenticated deployment attribution
        run: node run.mjs --admission
        env:
          GITHUB_TOKEN: ${{ github.token }}
          C1_ENABLED: ${{ vars.C1_NATIVE_ENABLED }}
          C1_TRUSTED_SHA: ${{ vars.C1_TRUSTED_HARNESS_SHA }}
          C1_HARNESS_SHA: ${{ vars.C1_TRUSTED_HARNESS_SHA }}
          C1_PRE_RECEIPT_ID: ${{ needs.preflight.outputs.pre_receipt_id }}
          C1_PRE_RECEIPT_DIGEST: ${{ needs.preflight.outputs.pre_receipt_digest }}
          C1_PRE_JOB_ID: ${{ needs.preflight.outputs.pre_job_id }}
      - name: Run bounded native acceptance
        id: phase
        run: |
          ulimit -c 0
          node run.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          C1_ENABLED: ${{ vars.C1_NATIVE_ENABLED }}
          C1_TRUSTED_SHA: ${{ vars.C1_TRUSTED_HARNESS_SHA }}
          C1_HARNESS_SHA: ${{ vars.C1_TRUSTED_HARNESS_SHA }}
          C1_PRE_RECEIPT_ID: ${{ needs.preflight.outputs.pre_receipt_id }}
          C1_PRE_RECEIPT_DIGEST: ${{ needs.preflight.outputs.pre_receipt_digest }}
          C1_PRE_JOB_ID: ${{ needs.preflight.outputs.pre_job_id }}
          C1_ACCOUNT_A_PASSWORD: ${{ secrets.C1_ACCOUNT_A_PASSWORD }}
          C1_ACCOUNT_B_PASSWORD: ${{ secrets.C1_ACCOUNT_B_PASSWORD }}
          C1_AUTOMATION_BYPASS_SECRET: ${{ inputs.protection_mode == 'automation-bypass' && secrets.C1_AUTOMATION_BYPASS_SECRET || '' }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: c1-sanitized-results
          path: |
            tools/c1-native-acceptance/artifacts/results.json
            tools/c1-native-acceptance/artifacts/phase.json
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 9

  post-verification:
    name: C1 external post verification
    needs: native
    # No account secrets, provider access or OIDC permission in this job.
    environment: c1-native-post-verification
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
      issues: read
      pull-requests: read
      checks: read
      statuses: read
    defaults:
      run:
        working-directory: tools/c1-native-acceptance
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ vars.C1_TRUSTED_HARNESS_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.19.0"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node run.mjs --post
        env:
          GITHUB_TOKEN: ${{ github.token }}
          C1_ENABLED: ${{ vars.C1_NATIVE_ENABLED }}
          C1_TRUSTED_SHA: ${{ vars.C1_TRUSTED_HARNESS_SHA }}
          C1_HARNESS_SHA: ${{ vars.C1_TRUSTED_HARNESS_SHA }}
          C1_PHASE_RESULT_B64: ${{ needs.native.outputs.phase_result_b64 }}
          C1_PHASE_DIGEST: ${{ needs.native.outputs.phase_digest }}
          C1_NATIVE_JOB_ID: ${{ needs.native.outputs.native_job_id }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: c1-post-verification
          path: tools/c1-native-acceptance/artifacts/results.json
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 9
