name: C1 harness offline verification
on:
  pull_request:
    paths:
      - 'tools/c1-native-acceptance/**'
      - '.github/workflows/c1-native-acceptance.yml'
      - '.github/workflows/c1-harness-ci.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: tools/c1-native-acceptance
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 07469f9f13aa3887a6ec7847b7b642a839651e63
          path: c1-app-under-test
          persist-credentials: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: c1-app-under-test/app
      - run: node prepare-source-fixture.mjs
        working-directory: tools/c1-native-acceptance
      - run: npm test
        working-directory: tools/c1-native-acceptance
